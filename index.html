<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 全賽事即時比分儀表板 (Live Sports Dashboard)</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --live-color: #e63946;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; color: var(--text-main); }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        
        /* 運動賽事大卡片區塊 */
        .sport-section { background: var(--card-bg); border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .sport-title { font-size: 1.3em; font-weight: bold; margin-top: 0; padding-bottom: 8px; border-bottom: 3px solid #1d428a; display: flex; justify-content: space-between; }
        .sport-title.mlb { border-bottom-color: #041e42; }
        .sport-title.lol { border-bottom-color: #00a3e0; }
        .sport-title.cpbl { border-bottom-color: #005a9c; }
        
        /* 具體比賽對戰小卡片 */
        .game-card { border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 10px; background: #fafafa; transition: transform 0.2s; }
        .game-card:hover { transform: translateY(-2px); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .game-status { display: flex; justify-content: space-between; font-size: 0.85em; color: #666; font-weight: bold; margin-bottom: 8px; }
        .live-badge { color: var(--live-color); animation: blink 1s infinite; }
        
        .team-row { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; font-size: 1em; }
        .team-name { font-weight: 500; }
        .team-score { font-size: 1.2em; font-weight: bold; color: #111; }
        .winner { color: #28a745; } /* 獲勝隊伍分數變綠 */

        /* 強化 1：道奇隊專用高亮樣式 */
        .dodgers-highlight { color: #e63946 !important; font-weight: bold !important; }

        /* 強化 2：LOL 風琴折疊專用樣式 */
        .lol-group-header {
            background: #e6f7ff;
            border-left: 4px solid #00a3e0;
            padding: 10px 12px;
            margin: 12px 0 6px 0;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 6px;
            font-size: 0.9em;
            user-select: none;
            transition: background 0.2s;
        }
        .lol-group-header:hover { background: #bae7ff; }
        .lol-group-content { padding-left: 2px; }
        .toggle-icon { font-size: 0.8em; color: #555; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .refresh-btn { padding: 8px 16px; background: #1d428a; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .refresh-btn:hover { background: #143063; }
    </style>
</head>
<body>

<div class="dashboard-header">
    <h2>🏆 全賽事即時比分儀表板</h2>
    <div>
        <span id="updateTime" style="margin-right: 15px; font-size: 0.9em; color:#666;">更新中...</span>
        <button class="refresh-btn" onclick="refreshAllScores()">🔄 立即手動更新</button>
    </div>
</div>

<div class="dashboard-grid">
    <div class="sport-section">
        <div class="sport-title">🏀 NBA 比分直播</div>
        <div id="nba-games" class="games-container"><p>載入中...</p></div>
    </div>

    <div class="sport-section">
        <div class="sport-title mlb">⚾ MLB 比分直播</div>
        <div id="mlb-games" class="games-container"><p>載入中...</p></div>
    </div>

    <div class="sport-section">
        <div class="sport-title cpbl">🥎 CPBL 中職比分</div>
        <div id="cpbl-games" class="games-container"><p>接口開發中 / 需中轉代理...</p></div>
    </div>

    <div class="sport-section">
        <div class="sport-title lol">🎮 LoL 電競賽程 (點擊聯賽可收合)</div>
        <div id="lol-games" class="games-container"><p>載入中...</p></div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    const API_NBA = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard';
    const API_MLB = 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard';

    $(document).ready(function() {
        refreshAllScores();
        setInterval(refreshAllScores, 60000); // 每 60 秒自動更新
    });

    function refreshAllScores() {
        $('#updateTime').text('正在同步最新比分...');
        
        fetchEspnScoreboard(API_NBA, '#nba-games');
        fetchEspnScoreboard(API_MLB, '#mlb-games');
        fetchCpblPlaceholder();
        fetchLolPlaceholder();

        const now = new Date();
        $('#updateTime').text(`上次更新: ${now.toLocaleTimeString()}`);
    }

    // 泛用 ESPN JSON API 解析器
    function fetchEspnScoreboard(url, containerId) {
        $.ajax({
            url: url,
            type: 'GET',
            dataType: 'json',
            success: function(data) {
                let html = '';
                const events = data.events || [];
                
                if (events.length === 0) {
                    $(containerId).html('<p style="color:#999;">今日無安排賽事</p>');
                    return;
                }

                events.forEach(event => {
                    const status = event.status.type;
                    const isLive = status.state === 'in';
                    const statusText = isLive ? `<span class="live-badge">● LIVE - ${event.status.type.detail}</span>` : status.detail;
                    
                    const teamAway = event.competitions[0].competitors[1]; // 客隊
                    const teamHome = event.competitions[0].competitors[0]; // 主隊

                    const awayWinner = teamAway.winner ? 'winner' : '';
                    const homeWinner = teamHome.winner ? 'winner' : '';

                    // 🛠️ 強化 1：動態檢查是否為洛杉磯道奇隊，若是則賦予高亮 Class
                    const isAwayDodgers = teamAway.team.displayName === "Los Angeles Dodgers" ? "dodgers-highlight" : "";
                    const isHomeDodgers = teamHome.team.displayName === "Los Angeles Dodgers" ? "dodgers-highlight" : "";

                    html += `
                        <div class="game-card">
                            <div class="game-status">${statusText}</div>
                            <div class="team-row">
                                <span class="team-name ${isAwayDodgers}">🚩 ${teamAway.team.displayName} (客)</span>
                                <span class="team-score ${awayWinner} ${isAwayDodgers}">${teamAway.score}</span>
                            </div>
                            <div class="team-row">
                                <span class="team-name ${isHomeDodgers}">🏠 ${teamHome.team.displayName} (主)</span>
                                <span class="team-score ${homeWinner} ${isHomeDodgers}">${teamHome.score}</span>
                            </div>
                        </div>
                    `;
                });
                $(containerId).html(html);
            },
            error: function() {
                $(containerId).html('<p style="color:var(--live-color);">連線失敗，無法取得即時資料</p>');
            }
        });
    }

    // 1. CPBL 三日倒序動態渲染
    function fetchCpblPlaceholder() {
        $.ajax({
            url: './cpbl_live.json',
            type: 'GET',
            dataType: 'json',
            cache: false,
            success: function(data) {
                let html = '';
                
                if (!data || data.length === 0) {
                    $('#cpbl-games').html('<p style="color:#999;">暫無 CPBL 賽事資料</p>');
                    return;
                }
    
                // 後端傳來的陣列已經是 [今天, 昨天, 前天]
                data.forEach(dayGroup => {
                    // 產生日期分組小表頭
                    html += `
                        <div style="font-weight: bold; margin: 15px 0 8px 0; color: #005a9c; border-bottom: 2px dashed #d0e1fd; padding-bottom: 4px; font-size: 0.95em;">
                            📅 賽事日期：${dayGroup.date}
                        </div>
                    `;
                    
                    if (dayGroup.games.length === 0) {
                        html += '<p style="color:#999; font-size:0.85em; padding-left:10px; margin-bottom: 15px;">🚫 當日無排定一軍賽事</p>';
                        return;
                    }
    
                    dayGroup.games.forEach(game => {
                        let statusText = '';
                        const status = game.status_key.toLowerCase();
                        
                        if (status === 'postponed') {
                            statusText = '<span style="color:#999;">❌ 因雨延賽</span>';
                        } else if (status === 'finished') {
                            statusText = '<span>✅ 完賽</span>';
                        } else if (status === 'not_started') {
                            statusText = `<span style="color:#005a9c;">⏰ 未開始</span>`;
                        } else {
                            statusText = `<span class="live-badge">● LIVE - ${game.status_long}</span>`;
                        }
    
                        let winAway = '';
                        let winHome = '';
                        if (status === 'finished') {
                            if (parseInt(game.away_score) > parseInt(game.home_score)) winAway = 'winner';
                            if (parseInt(game.home_score) > parseInt(game.away_score)) winHome = 'winner';
                        }
    
                        html += `
                            <div class="game-card">
                                <div class="game-status">
                                    <span>🏟️ ${game.venue}</span>
                                    <span>${statusText}</span>
                                </div>
                                <div class="team-row">
                                    <span class="team-name">🚩 ${game.away_name} (客)</span>
                                    <span class="team-score ${winAway}">${game.away_score}</span>
                                </div>
                                <div class="team-row">
                                    <span class="team-name">🏠 ${game.home_name} (主)</span>
                                    <span class="team-score ${winHome}">${game.home_score}</span>
                                </div>
                            </div>
                        `;
                    });
                });
                $('#cpbl-games').html(html);
            },
            error: function() {
                $('#cpbl-games').html('<p style="color:var(--live-color);">暫無 CPBL 資料，等待 Actions 初始化...</p>');
            }
        });
    }
    
    // 2. LOL 群組倒序、預設隱藏 ＆ 【今日有賽事紅字高亮】
    function fetchLolPlaceholder() {
        $.ajax({
            url: './lol_live.json',
            type: 'GET',
            dataType: 'json',
            cache: false,
            success: function(data) {
                if (!data || data.length === 0) {
                    $('#lol-games').html('<p style="color:#999;">今日無 LOL 安排賽事</p>');
                    return;
                }
    
                let groupedMatches = {};
                data.forEach(match => {
                    if (!groupedMatches[match.OverviewPage]) {
                        groupedMatches[match.OverviewPage] = [];
                    }
                    groupedMatches[match.OverviewPage].push(match);
                });
    
                // 聯賽名稱字串倒序排序
                const sortedOverviewPages = Object.keys(groupedMatches).sort().reverse();
    
                let html = '';
                let groupIdx = 0;
                const todayStr = new Date().toISOString().split('T')[0]; // 自動追蹤當前日期 (2026-06-10)
    
                sortedOverviewPages.forEach(overviewPage => {
                    groupIdx++;
                    
                    // 🛠️ 修正需求二：精確動態檢查該聯賽群組內，有沒有任何一場比賽是今天的
                    const hasTodayGame = groupedMatches[overviewPage].some(match => match.LatestGameTime.includes(todayStr));
                    
                    // 如果今天有比賽，將字體與左側邊框動態改為紅色，否則維持預設樣式
                    const highlightStyle = hasTodayGame ? 'style="color: #e63946; border-left-color: #e63946; background: #fff1f0;"' : '';
    
                    // 預設隱藏 style="display: none;" 
                    html += `
                        <div class="lol-group">
                            <div class="lol-group-header" data-target="lol-group-${groupIdx}" ${highlightStyle}>
                                <span>🎮 ${overviewPage}</span>
                                <span class="toggle-icon">▲</span>
                            </div>
                            <div id="lol-group-${groupIdx}" class="lol-group-content" style="display: none;">
                    `;
    
                    groupedMatches[overviewPage].forEach(match => {
                        const isLive = match.LatestGameTime.includes(todayStr); 
                        const statusText = isLive ? `<span class="live-badge">● LIVE - 進行中</span>` : '已結束/歷史';
                        
                        const winA = match.ScoreA > match.ScoreB ? 'winner' : '';
                        const winB = match.ScoreB > match.ScoreA ? 'winner' : '';
    
                        html += `
                            <div class="game-card">
                                <div class="game-status">
                                    <span>${statusText}</span>
                                </div>
                                <div class="team-row">
                                    <span class="team-name">🔵 ${match.TeamA}</span>
                                    <span class="team-score ${winA}">${match.ScoreA}</span>
                                </div>
                                <div class="team-row">
                                    <span class="team-name">🔴 ${match.TeamB}</span>
                                    <span class="team-score ${winB}">${match.ScoreB}</span>
                                </div>
                                <div style="font-size:0.75em; color:#999; text-align:right; margin-top:5px;">
                                    最後更新: ${match.LatestGameTime}
                                </div>
                            </div>
                        `;
                    });
    
                    html += `
                            </div>
                        </div>
                    `;
                });
                $('#lol-games').html(html);
    
                // 綁定收合事件
                $('.lol-group-header').off('click').on('click', function() {
                    const targetId = $(this).data('target');
                    const $content = $(`#${targetId}`);
                    const $icon = $(this).find('.toggle-icon');
                    
                    $content.slideToggle(200, function() {
                        if ($content.is(':visible')) {
                            $icon.text('▼');
                        } else {
                            $icon.text('▲');
                        }
                    });
                });
            },
            error: function() {
                $('#lol-games').html('<p style="color:var(--live-color);">暫無 LOL 賽事資料，等待 Actions 首次初始化...</p>');
            }
        });
    }
</script>
</body>
</html>
