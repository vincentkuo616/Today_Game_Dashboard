<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 全賽事即時比分儀表板 (Live Sports Dashboard)</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --live-color: #e63946;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; color: var(--text-main); }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        
        /* 運動賽事大卡片區塊 */
        .sport-section { background: var(--card-bg); border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); height: fit-content; }
        
        /* 大標題改為可點擊樣式 pointer */
        .sport-title { 
            font-size: 1.3em; 
            font-weight: bold; 
            margin-top: 0; 
            padding-bottom: 8px; 
            border-bottom: 3px solid #1d428a; 
            display: flex; 
            justify-content: space-between; 
            cursor: pointer; 
            user-select: none;
        }
        .sport-title.mlb { border-bottom-color: #041e42; }
        .sport-title.lol { border-bottom-color: #00a3e0; }
        .sport-title.cpbl { border-bottom-color: #005a9c; }
        .sport-toggle-icon { font-size: 0.8em; color: #888; transition: transform 0.2s; }
        
        /* 具體比賽對戰小卡片 */
        .game-card { border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 10px; background: #fafafa; transition: transform 0.2s; }
        .game-card:hover { transform: translateY(-2px); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .game-status { display: flex; justify-content: space-between; font-size: 0.85em; color: #666; font-weight: bold; margin-bottom: 8px; }
        .live-badge { color: var(--live-color); animation: blink 1s infinite; }
        
        .team-row { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; font-size: 1em; }
        .team-name { font-weight: 500; }
        .team-score { font-size: 1.2em; font-weight: bold; color: #111; }
        .winner { color: #28a745; }
        
        .dodgers-highlight { color: #e63946 !important; font-weight: bold !important; }

        /* 🛠️ 新增樣式：MLB 五局逆轉勝專用橘色高亮（具備最高優先權防禦） */
        .orange-highlight { color: #ff7f00 !important; font-weight: bold !important; }

        /* LOL 風琴折疊專用樣式 */
        .lol-group-header {
            background: #e6f7ff;
            border-left: 4px solid #00a3e0;
            padding: 10px 12px;
            margin: 12px 0 6px 0;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 6px;
            font-size: 0.9em;
            user-select: none;
            transition: background 0.2s;
        }
        .lol-group-header:hover { background: #bae7ff; }
        .lol-group-content { padding-left: 2px; }
        .toggle-icon { font-size: 0.8em; color: #555; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .refresh-btn { padding: 8px 16px; background: #1d428a; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .refresh-btn:hover { background: #143063; }
    </style>
</head>
<body>

<div class="dashboard-header">
    <h2>🏆 全賽事即時比分儀表板</h2>
    <div>
        <span id="updateTime" style="margin-right: 15px; font-size: 0.9em; color:#666;">更新中...</span>
        <button class="refresh-btn" onclick="refreshAllScores()">🔄 立即手動更新</button>
    </div>
</div>

<div class="dashboard-grid">
    <div class="sport-section">
        <div class="sport-title" id="title-nba"><span>🏀 NBA 比分直播</span><span class="sport-toggle-icon">▼</span></div>
        <div id="nba-games" class="games-container"><p>載入中...</p></div>
    </div>

    <div class="sport-section">
        <div class="sport-title mlb" id="title-mlb"><span>⚾ MLB 比分直播</span><span class="sport-toggle-icon">▼</span></div>
        <div id="mlb-games" class="games-container"><p>載入中...</p></div>
    </div>

    <div class="sport-section">
        <div class="sport-title cpbl" id="title-cpbl"><span>🥎 CPBL 中職比分</span><span class="sport-toggle-icon">▼</span></div>
        <div id="cpbl-games" class="games-container"><p>載入中...</p></div>
    </div>

    <div class="sport-section">
        <div class="sport-title lol" id="title-lol"><span>🎮 LoL 電競賽程</span><span class="sport-toggle-icon">▼</span></div>
        <div id="lol-games" class="games-container"><p>載入中...</p></div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    const API_NBA = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard';
    const API_MLB = 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard';

    // ⏳ 在地化日期動態防禦機制
    const now = new Date();
    const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    
    const yesterdayObj = new Date();
    yesterdayObj.setDate(now.getDate() - 1);
    const yesterdayStr = yesterdayObj.getFullYear() + '-' + String(yesterdayObj.getMonth() + 1).padStart(2, '0') + '-' + String(yesterdayObj.getDate()).padStart(2, '0');

    // 🔒 狀態保護鎖：防止定時刷新時蓋掉使用者手動折疊的狀態
    let firstLoad = { nba: true, mlb: true, cpbl: true, lol: true };

    $(document).ready(function() {
        refreshAllScores();
        setInterval(refreshAllScores, 60000); // 每 60 秒自動更新

        // 大標題點擊綁定收合事件
        $('.sport-title').on('click', function() {
            const $container = $(this).next('.games-container');
            const $icon = $(this).find('.sport-toggle-icon');
            $container.slideToggle(200, function() {
                $icon.text($container.is(':visible') ? '▼' : '▲');
            });
        });
    });

    function refreshAllScores() {
        $('#updateTime').text('正在同步最新比分...');
        
        fetchEspnScoreboard(API_NBA, '#nba-games', 'nba');
        fetchEspnScoreboard(API_MLB, '#mlb-games', 'mlb');
        fetchCpblPlaceholder();
        fetchLolPlaceholder();

        const timeNow = new Date();
        $('#updateTime').text(`上次更新: ${timeNow.toLocaleTimeString()}`);
    }

    // 泛用 ESPN JSON API 解析器
    function fetchEspnScoreboard(url, containerId, sportKey) {
        $.ajax({
            url: url,
            type: 'GET',
            dataType: 'json',
            success: function(data) {
                let html = '';
                const events = data.events || [];
                let hasRecentGame = false;
                
                if (events.length === 0) {
                    $(containerId).html('<p style="color:#999;">今日無安排賽事</p>');
                    handleDefaultCollapse(containerId, sportKey, false);
                    return;
                }

                events.forEach(event => {
                    // 掃描是否有今天或昨天的比賽
                    if (event.date && (event.date.includes(todayStr) || event.date.includes(yesterdayStr))) {
                        hasRecentGame = true;
                    }

                    const status = event.status.type;
                    const isLive = status.state === 'in';
                    const isFinished = status.state === 'post'; // 判定是否完賽
                    const statusText = isLive ? `<span class="live-badge">● LIVE - ${event.status.type.detail}</span>` : status.detail;
                    
                    const teamAway = event.competitions[0].competitors[1]; 
                    const teamHome = event.competitions[0].competitors[0]; 

                    const awayWinner = teamAway.winner ? 'winner' : '';
                    const homeWinner = teamHome.winner ? 'winner' : '';

                    const isAwayDodgers = teamAway.team.displayName === "Los Angeles Dodgers" ? "dodgers-highlight" : "";
                    const isHomeDodgers = teamHome.team.displayName === "Los Angeles Dodgers" ? "dodgers-highlight" : "";

                    // 🛠️ 核心演算法：MLB 五局逆轉勝判定邏輯
                    let isAwayOrange = "";
                    let isHomeOrange = "";

                    if (sportKey === 'mlb' && isFinished) {
                        const awayLines = teamAway.linescores;
                        const homeLines = teamHome.linescores;

                        // 防禦條件：確保局數有記到 5 局以上才進行加總
                        if (awayLines && homeLines && awayLines.length >= 5 && homeLines.length >= 5) {
                            let away5thSum = 0;
                            let home5thSum = 0;

                            // 迴圈加總前五局分數 (Index 0 ~ 4)
                            for (let i = 0; i < 5; i++) {
                                away5thSum += (awayLines[i].value || 0);
                                home5thSum += (homeLines[i].value || 0);
                            }

                            // 情況一：五局結束客隊領先，但最終主隊贏球 -> 主隊標橘色
                            if (away5thSum > home5thSum && teamHome.winner) {
                                isHomeOrange = "orange-highlight";
                            }
                            // 情況二：五局結束主隊領先，但最終客隊贏球 -> 客隊標橘色
                            else if (home5thSum > away5thSum && teamAway.winner) {
                                isAwayOrange = "orange-highlight";
                            }
                        }
                    }

                    html += `
                        <div class="game-card">
                            <div class="game-status">${statusText}</div>
                            <div class="team-row">
                                <span class="team-name ${isAwayDodgers} ${isAwayOrange}">🚩 ${teamAway.team.displayName} (客)</span>
                                <span class="team-score ${awayWinner} ${isAwayDodgers} ${isAwayOrange}">${teamAway.score}</span>
                            </div>
                            <div class="team-row">
                                <span class="team-name ${isHomeDodgers} ${isHomeOrange}">🏠 ${teamHome.team.displayName} (主)</span>
                                <span class="team-score ${homeWinner} ${isHomeDodgers} ${isHomeOrange}">${teamHome.score}</span>
                            </div>
                        </div>
                    `;
                });
                $(containerId).html(html);
                
                handleDefaultCollapse(containerId, sportKey, hasRecentGame);
            },
            error: function() {
                $(containerId).html('<p style="color:var(--live-color);">連線失敗，無法取得即時資料</p>');
            }
        });
    }

    // CPBL 三日倒序動態渲染
    // 🛠️ 修正點一：優化後的 CPBL 三日倒序動態渲染函數
    function fetchCpblPlaceholder() {
        $.ajax({
            url: './cpbl_live.json',
            type: 'GET',
            dataType: 'json',
            cache: false,
            success: function(data) {
                let html = '';
                let hasRecentGame = false;
                
                if (!data || data.length === 0) {
                    $('#cpbl-games').html('<p style="color:#999;">暫無 CPBL 賽事資料</p>');
                    handleDefaultCollapse('#cpbl-games', 'cpbl', false);
                    return;
                }
    
                data.forEach(dayGroup => {
                    if ((dayGroup.date === todayStr || dayGroup.date === yesterdayStr) && dayGroup.games.length > 0) {
                        hasRecentGame = true;
                    }
    
                    html += `
                        <div style="font-weight: bold; margin: 15px 0 8px 0; color: #005a9c; border-bottom: 2px dashed #d0e1fd; padding-bottom: 4px; font-size: 0.95em;">
                            📅 賽事日期：${dayGroup.date}
                        </div>
                    `;
                    
                    if (dayGroup.games.length === 0) {
                        html += '<p style="color:#999; font-size:0.85em; padding-left:10px; margin-bottom: 15px;">🚫 當日無排定一軍賽事</p>';
                        return;
                    }
    
                    dayGroup.games.forEach(game => {
                        let statusText = '';
                        const status = game.status_key.toLowerCase();
                        
                        if (status === 'postponed') {
                            statusText = '<span style="color:#999;">❌ 因雨延賽</span>';
                        } else if (status === 'finished') {
                            statusText = '<span>✅ 完賽</span>';
                        } else if (status === 'scheduled') { // ◄── 修正對齊：將 'not_started' 改為 'scheduled'
                            statusText = `<span style="color:#005a9c;">⏰ 未開始</span>`;
                        } else {
                            statusText = `<span class="live-badge">● LIVE - ${game.status_long}</span>`;
                        }
    
                        let winAway = '';
                        let winHome = '';
                        if (status === 'finished') {
                            if (parseInt(game.away_score) > parseInt(game.home_score)) winAway = 'winner';
                            if (parseInt(game.home_score) > parseInt(game.away_score)) winHome = 'winner';
                        }
    
                        html += `
                            <div class="game-card">
                                <div class="game-status">
                                    <span>🏟️ ${game.venue}</span>
                                    <span>${statusText}</span>
                                </div>
                                <div class="team-row">
                                    <span class="team-name">🚩 ${game.away_name} (客)</span>
                                    <span class="team-score ${winAway}">${game.away_score}</span>
                                </div>
                                <div class="team-row">
                                    <span class="team-name">🏠 ${game.home_name} (主)</span>
                                    <span class="team-score ${winHome}">${game.home_score}</span>
                                </div>
                            </div>
                        `;
                    });
                });
                $('#cpbl-games').html(html);
                
                handleDefaultCollapse('#cpbl-games', 'cpbl', hasRecentGame);
            },
            error: function() {
                $('#cpbl-games').html('<p style="color:var(--live-color);">暫無 CPBL 資料，等待 Actions 初始化...</p>');
            }
        });
    }
    
    // 🛠️ 修正點二：升級版的自動折疊控制中心（新增死鎖動態解鎖器）
    function handleDefaultCollapse(containerId, sportKey, hasRecentGame) {
        if (firstLoad[sportKey]) {
            const $title = $(containerId).prev('.sport-title');
            if (!hasRecentGame) {
                $(containerId).hide();
                $title.find('.sport-toggle-icon').text('▲');
            } else {
                $(containerId).show();
                $title.find('.sport-toggle-icon').text('▼');
            }
            firstLoad[sportKey] = false;
        } else {
            // 🛡️ 狀態動態解鎖：如果後續背景輪詢發現今天有新比賽了，而原本面板是隱藏的，必須強行喚醒展開
            if (hasRecentGame && !$(containerId).is(':visible')) {
                $(containerId).show();
                $(containerId).prev('.sport-title').find('.sport-toggle-icon').text('▼');
            }
        }
    }

    // LOL 群組倒序、預設隱藏 ＆ 【今日/昨日有賽事紅字高亮】
    function fetchLolPlaceholder() {
        $.ajax({
            url: './lol_live.json',
            type: 'GET',
            dataType: 'json',
            cache: false,
            success: function(data) {
                if (!data || data.length === 0) {
                    $('#lol-games').html('<p style="color:#999;">今日無 LOL 安排賽事</p>');
                    handleDefaultCollapse('#lol-games', 'lol', false);
                    return;
                }

                let groupedMatches = {};
                data.forEach(match => {
                    if (!groupedMatches[match.OverviewPage]) {
                        groupedMatches[match.OverviewPage] = [];
                    }
                    groupedMatches[match.OverviewPage].push(match);
                });

                const sortedOverviewPages = Object.keys(groupedMatches).sort().reverse();
                const hasAnyRecentGame = data.some(match => match.LatestGameTime.includes(todayStr) || match.LatestGameTime.includes(yesterdayStr));

                let html = '';
                let groupIdx = 0;

                sortedOverviewPages.forEach(overviewPage => {
                    groupIdx++;
                    
                    const hasRecentMatch = groupedMatches[overviewPage].some(match => 
                        match.LatestGameTime.includes(todayStr) || match.LatestGameTime.includes(yesterdayStr)
                    );
                    
                    const highlightStyle = hasRecentMatch ? 'style="color: #e63946; border-left-color: #e63946; background: #fff1f0;"' : '';

                    html += `
                        <div class="lol-group">
                            <div class="lol-group-header" data-target="lol-group-${groupIdx}" ${highlightStyle}>
                                <span>🎮 ${overviewPage}</span>
                                <span class="toggle-icon">▲</span>
                            </div>
                            <div id="lol-group-${groupIdx}" class="lol-group-content" style="display: none;">
                    `;

                    groupedMatches[overviewPage].forEach(match => {
                        const isLive = match.LatestGameTime.includes(todayStr); 
                        const statusText = isLive ? `<span class="live-badge">● LIVE - 進行中</span>` : '已結束/歷史';
                        
                        const winA = match.ScoreA > match.ScoreB ? 'winner' : '';
                        const winB = match.ScoreB > match.ScoreA ? 'winner' : '';

                        html += `
                            <div class="game-card">
                                <div class="game-status">
                                    <span>${statusText}</span>
                                </div>
                                <div class="team-row">
                                    <span class="team-name">🔵 ${match.TeamA}</span>
                                    <span class="team-score ${winA}">${match.ScoreA}</span>
                                </div>
                                <div class="team-row">
                                    <span class="team-name">🔴 ${match.TeamB}</span>
                                    <span class="team-score ${winB}">${match.ScoreB}</span>
                                </div>
                                <div style="font-size:0.75em; color:#999; text-align:right; margin-top:5px;">
                                    最後更新: ${match.LatestGameTime}
                                </div>
                            </div>
                        `;
                    });

                    html += `
                            </div>
                        </div>
                    `;
                });
                $('#lol-games').html(html);

                $('.lol-group-header').off('click').on('click', function() {
                    const targetId = $(this).data('target');
                    const $content = $(`#${targetId}`);
                    const $icon = $(this).find('.toggle-icon');
                    $content.slideToggle(200, function() {
                        $icon.text($content.is(':visible') ? '▼' : '▲');
                    });
                });

                handleDefaultCollapse('#lol-games', 'lol', hasAnyRecentGame);
            },
            error: function() {
                $('#lol-games').html('<p style="color:var(--live-color);">暫無 LOL 賽事資料，等待 Actions 首次初始化...</p>');
            }
        });
    }

    // 核心自動折疊控制中心
    function handleDefaultCollapse(containerId, sportKey, hasRecentGame) {
        if (firstLoad[sportKey]) {
            const $title = $(containerId).prev('.sport-title');
            if (!hasRecentGame) {
                $(containerId).hide();
                $title.find('.sport-toggle-icon').text('▲');
            } else {
                $(containerId).show();
                $title.find('.sport-toggle-icon').text('▼');
            }
            firstLoad[sportKey] = false;
        }
    }
</script>
</body>
</html>
